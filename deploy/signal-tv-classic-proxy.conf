# Shared by the /tv locations (signal-tv-classic.service on 127.0.0.1:8790).
proxy_http_version 1.1;
proxy_set_header Connection "";
proxy_set_header Host 127.0.0.1:8790;
proxy_set_header Authorization "";          # never pass Basic Auth credentials on
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Proto https;
proxy_set_header Forwarded "";
proxy_set_header X-Forwarded-Host "";
proxy_redirect off;
proxy_connect_timeout 3s;
proxy_send_timeout 60s;
include snippets/signal-tv-classic-headers.conf;
