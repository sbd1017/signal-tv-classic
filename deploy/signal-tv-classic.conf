# Signal TV Classic: /tv -> signal-tv-classic.service (127.0.0.1:8790). Included from
# sites-available/example.com.conf. Only GET/HEAD reach it (server-level map), except
# POST to /tv/api/state and /tv/api/state/import (synced favourites/progress; the map in
# conf.d/10-site.conf has a line for exactly those two paths).
#
# Login: the site's existing Basic Auth (snippets/site-basic-auth.conf), OR the
# app's signed 30-day session cookie, which the app issues only to a request that
# passed Basic Auth (nginx forwards the authenticated user in X-TV-Auth-User).
# The cookie is checked by auth_request so the home-screen app needn't re-login.
# /tv/m/ (video) is authorised by short-lived signed tokens in the path instead,
# because native players / PiP / AirPlay do not reliably send credentials.

location = /tv {
    include snippets/signal-tv-classic-headers.conf;
    return 308 /tv/;
}

location = /_tv_session {
    internal;
    proxy_pass http://127.0.0.1:8790/tv/api/auth-check;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header Authorization "";
    proxy_set_header Host 127.0.0.1:8790;
    proxy_connect_timeout 2s;
    proxy_read_timeout 5s;
}

location ^~ /tv/ {
    access_log /var/log/nginx/signal-tv-classic.access.log signal_tv_classic;
    error_log /var/log/nginx/signal-tv-classic.error.log crit;
    satisfy any;
    include snippets/site-basic-auth.conf;
    auth_request /_tv_session;
    limit_conn signal_tv_classic_conn 40;
    limit_conn_status 429;
    limit_req zone=signal_tv_classic burst=200 nodelay;
    limit_req_status 429;
    proxy_pass http://127.0.0.1:8790;
    include snippets/signal-tv-classic-proxy.conf;
    proxy_set_header X-TV-Auth-User $remote_user;
    proxy_read_timeout 75s;                  # /tv/api/play waits for a stream to start
    client_max_body_size 1k;                 # no uploads anywhere under /tv except below

    location ^~ /tv/api/state {              # synced state: small JSON POSTs, backup-file import
        client_max_body_size 1m;
        proxy_pass http://127.0.0.1:8790;
        include snippets/signal-tv-classic-proxy.conf;
        proxy_set_header X-TV-Auth-User $remote_user;
    }

    location ^~ /tv/api/img/ {               # artwork: own buckets (30-signal-tv-classic.conf), not the page's
        limit_conn signal_tv_classic_img_conn 200;
        limit_req zone=signal_tv_classic_img burst=1000 nodelay;
        proxy_pass http://127.0.0.1:8790;
        include snippets/signal-tv-classic-proxy.conf;
        proxy_set_header X-TV-Auth-User $remote_user;
    }

    location ^~ /tv/api/play/ {              # starting streams: a few per second is plenty
        limit_req zone=signal_tv_classic_play burst=12 nodelay;
        proxy_pass http://127.0.0.1:8790;
        include snippets/signal-tv-classic-proxy.conf;
        proxy_set_header X-TV-Auth-User $remote_user;
        proxy_read_timeout 75s;
    }

    location ^~ /tv/m/ {                     # media: signed token in the path, no login
        auth_basic off;
        auth_request off;
        satisfy all;
        limit_req zone=signal_tv_classic_media burst=240 nodelay;
        proxy_pass http://127.0.0.1:8790;
        include snippets/signal-tv-classic-proxy.conf;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_max_temp_file_size 0;
        proxy_read_timeout 120s;
    }

    location ^~ /tv/pwa/ {                   # manifest + icons: iOS fetches them without credentials
        auth_basic off;
        auth_request off;
        satisfy all;
        proxy_pass http://127.0.0.1:8790;
        include snippets/signal-tv-classic-proxy.conf;
    }
}
