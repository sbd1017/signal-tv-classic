# Signal TV Classic (/tv): abuse limits + privacy-safe access log (http context).
# $remote_addr is the visitor IP (realip from CF-Connecting-IP, see 00-hardening.conf).
limit_req_zone  $binary_remote_addr zone=signal_tv_classic:10m       rate=20r/s;
limit_req_zone  $binary_remote_addr zone=signal_tv_classic_media:10m rate=40r/s;
limit_req_zone  $binary_remote_addr zone=signal_tv_classic_play:10m  rate=2r/s;
limit_conn_zone $binary_remote_addr zone=signal_tv_classic_conn:10m;
# artwork has its own buckets: a long list asks for hundreds of logos at once, and slow upstream fetches
# hold connections - that must never use up the page's API or the player's video allowance
limit_req_zone  $binary_remote_addr zone=signal_tv_classic_img:10m   rate=100r/s;
limit_conn_zone $binary_remote_addr zone=signal_tv_classic_img_conn:10m;

# Media URLs carry a signed token; it is replaced before anything is logged.
# No query strings, cookies, Authorization headers or provider URLs are logged.
map $uri $signal_tv_classic_log_path {
    "~^/tv/m/[^/]+/(?<rest>.*)$" "/tv/m/<token>/$rest";
    default $uri;
}
log_format signal_tv_classic escape=json
  '{"t":"$time_iso8601","ip":"$remote_addr","cc":"$http_cf_ipcountry","m":"$request_method",'
  '"path":"$signal_tv_classic_log_path","st":"$status","bytes":"$body_bytes_sent","rt":"$request_time",'
  '"user":"$remote_user","ray":"$http_cf_ray"}';
